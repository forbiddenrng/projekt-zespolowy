name: Integration Tests

on:
  pull_request:
    branches: ["develop"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up -d
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_URL: ${{ secrets.OPENROUTER_URL }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          THEIRSTACK_API_URL: ${{ secrets.THEIRSTACK_API_URL }}

      - name: Wait for PostgreSQL to be ready
        run: |
          timeout 30 bash -c 'until docker compose -f docker-compose.test.yml exec -T postgres-test pg_isready -U test_admin -d userdb_test > /dev/null 2>&1; do sleep 1; done'

      - name: Wait for MongoDB to be ready
        run: |
          timeout 30 bash -c 'until docker compose -f docker-compose.test.yml exec -T mongodb-test mongosh --eval "db.adminCommand(\"ping\")" > /dev/null 2>&1; do sleep 1; done'

      - name: Wait for Redis to be ready
        run: |
          timeout 30 bash -c 'until docker compose -f docker-compose.test.yml exec -T redis-test redis-cli ping > /dev/null 2>&1; do sleep 1; done'

      - name: Wait for User Service to be healthy
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:5051/health > /dev/null 2>&1; do sleep 2; done'

      - name: Wait for AI Service to be healthy
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8001/health > /dev/null 2>&1; do sleep 2; done'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize test data
        working-directory: ./ai-service
        run: |
          python -m app.scripts.init_test_data
        env:
          PYTHONUNBUFFERED: 1

      - name: Run integration tests
        working-directory: ./ai-service
        run: |
          pytest tests/integration -v --tb=short -m integration
        env:
          PYTHONUNBUFFERED: 1

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker-compose -f docker-compose.test.yml logs > docker-logs.txt
          
      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-docker-logs
          path: docker-logs.txt

      - name: Cleanup services
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v