version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: user_db_postgresql
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: ai-service-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    
  # ai-mongodb:
  #   image: mongo:latest
  #   container_name: ai-service-mongodb
  #   restart: always
  #   ports:
  #     - "27017:27017"
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: password
  #     MONGO_INITDB_DATABASE: ai-service
  #   volumes:
  #     - mongodb_data:/data/db
  #     - mongodb_config:/data/configdb
  #   healthcheck:
  #     test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  ai-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - API_BASE_URL=${API_BASE_URL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - OPENROUTER_URL=${OPENROUTER_URL}
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB=${MONGODB_DB}
      - THEIRSTACK_API_KEY=${THEIRSTACK_API_KEY}
      - THEIRSTACK_API_URL=${THEIRSTACK_API_URL}
    volumes:
      - ./ai-service:/app
      - ./ai-service/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  ai-celery-worker:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service-celery
    restart: always
    # ports:
    #   - "8000:8000"
    environment:
    - PYTHONUNBUFFERED=1
    - CELERY_BROKER_URL=${CELERY_BROKER_URL}
    - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    - USER_SERVICE_URL=${USER_SERVICE_URL}
    - API_BASE_URL=${API_BASE_URL}
    - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    - OPENROUTER_URL=${OPENROUTER_URL}
    - MONGODB_URL=${MONGODB_URL}
    - MONGODB_DB=${MONGODB_DB}
    - THEIRSTACK_API_KEY=${THEIRSTACK_API_KEY}
    - THEIRSTACK_API_URL=${THEIRSTACK_API_URL}
    volumes:
      - ./ai-service:/app
      - ./ai-service/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.services.cv_task worker --loglevel=info
    networks:
      - app-network
  

volumes:
  postgres_data:
  # mongodb_data:
  # mongodb_config:
  redis_data:

networks:
  app-network:
    driver: bridge
