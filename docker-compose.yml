version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: user_db_postgresql
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  redis:
    image: redis:7-alpine
    container_name: ai-service-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service-app
    restart: always
    ports:
      - "5050:5000"
    env_file:
      - ./user-service/.env
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/userdb?schema=public
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:5000/health", (res) => process.exit(res.statusCode === 200 ? 0 : 1))'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./gateway/.env
    environment:
      - AI_SERVICE=http://ai-service:8000
      - USER_SERVICE=http://user-service:5000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      user-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      # Używamy Node.js dla Gatewaya
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:4000/health", (res) => process.exit(res.statusCode === 200 ? 0 : 1))'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service-app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://ai-service-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://ai-service-redis:6379/0
      - USER_SERVICE_URL=http://user-service:5000
      - API_BASE_URL=http://ai-service:8000
    volumes:
      - ./ai-service:/app
      - ./ai-service/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c ''import urllib.request; urllib.request.urlopen("http://localhost:8000/health").read()'' || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  ai-celery-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service-celery
    restart: always
    env_file:
      - ./ai-service/.env
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USER_SERVICE_URL=http://user-service:5000
    volumes:
      - ./ai-service:/app
      - ./ai-service/storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.services.cv_task worker --loglevel=info
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
